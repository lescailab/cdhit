# Without these pins the newest sysroot is used and the binaries need glibc >= 2.38,
# which excludes most HPC clusters (RHEL 8/9, Ubuntu 22.04).
c_stdlib:
  - sysroot                   # [linux]
  - macosx_deployment_target  # [osx]
c_stdlib_version:
  - 2.17                      # [linux]
  - 11.0                      # [osx and arm64]
